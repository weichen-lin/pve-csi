apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "pve-csi.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "pve-csi.labels" . | nindent 4 }}
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-controller
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch, patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "pve-csi.labels" . | nindent 4 }}
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "pve-csi.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Release.Name }}-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi
          image: {{ include "pve-csi.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [controller, "--endpoint=unix:///csi/csi.sock"]
          env:
            - name: CSI_DRIVER_NAME
              value: {{ .Values.driverName | quote }}
            - name: PVE_ENDPOINT
              value: {{ .Values.pve.endpoint | quote }}
            - name: PVE_NODE
              value: {{ .Values.pve.node | quote }}
            - name: PVE_OWNER_VMID
              value: {{ .Values.pve.ownerVMID | quote }}
            {{- if .Values.pve.caConfigMap }}
            - name: PVE_CA_FILE
              value: /etc/pve/ca.crt
            {{- end }}
            - name: PVE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pve.existingSecret | quote }}
                  key: PVE_TOKEN_ID
            - name: PVE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pve.existingSecret | quote }}
                  key: PVE_TOKEN_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [/usr/local/bin/pve-csi, probe, "--endpoint=unix:///csi/csi.sock", --timeout=2s]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: [/usr/local/bin/pve-csi, probe, "--endpoint=unix:///csi/csi.sock", --timeout=2s]
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [/usr/local/bin/pve-csi, probe, "--endpoint=unix:///csi/csi.sock", --timeout=2s]
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: socket
              mountPath: /csi
            {{- if .Values.pve.caConfigMap }}
            - name: pve-ca
              mountPath: /etc/pve
              readOnly: true
            {{- end }}
        - name: attacher
          image: {{ .Values.sidecars.attacher | quote }}
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=90s
            - --worker-threads=1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: provisioner
          image: {{ .Values.sidecars.provisioner | quote }}
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=60s
            - --worker-threads=1
            - --snapshot-orphan-sweep-interval=0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.sidecars.resources | nindent 12 }}
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        - name: socket
          emptyDir: {}
        {{- if .Values.pve.caConfigMap }}
        - name: pve-ca
          configMap:
            name: {{ .Values.pve.caConfigMap | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
