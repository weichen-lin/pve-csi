# Replace the example PVE settings before deployment.
# Install once per driver name; keep it unchanged while PVs exist.
driverName: pve-csi.local

image:
  repository: ghcr.io/weichen-lin/pve-csi
  # Must match Chart.yaml appVersion.
  tag: v0.2.1
  pullPolicy: IfNotPresent
# For private images: [{name: registry-login}].
imagePullSecrets: []

pve:
  # The hostname or IP must match the server certificate.
  endpoint: https://pve.example.com:8006
  # PVE host name, not a Kubernetes node name.
  node: pve
  # Reserve this ID; do not assign it to a VM or LXC. Keep it stable while PVs exist.
  ownerVMID: 7777
  # Existing Secret in the release namespace with PVE_TOKEN_ID and PVE_TOKEN_SECRET.
  existingSecret: pve-csi-pve
  # Existing ConfigMap with ca.crt; empty uses system trust.
  caConfigMap: ""

# All selected nodes must be VMs on pve.node; images support amd64 only.
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

controller:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
node:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

sidecars:
  attacher: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
  registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

storageClass:
  create: true
  name: pve-csi
  # Existing PVE storage ID.
  storage: data-ssd
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  defaultClass: false

# Suspended CronJob for read-only PVE checks; start Jobs manually.
check:
  enabled: false
  # Required when enabled: PVE VMIDs of the Kubernetes nodes.
  vmids: []
  # Timeout for the entire check.
  timeout: 60s
  # Completed Job TTL in seconds; history limits may delete Jobs sooner.
  ttlSecondsAfterFinished: 86400
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
