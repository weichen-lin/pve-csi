name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Lint
        run: make lint

      - name: Check Go
        run: make check-go

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Check Helm chart
        run: make check-helm

  publish:
    name: Publish image
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          revision=$(git rev-parse HEAD)
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Git tag must be a valid Docker tag: up to 128 letters, digits, underscores, dots or hyphens; cannot start with a dot or hyphen.'
            exit 1
          fi
          {
            echo "name=ghcr.io/${REPOSITORY,,}"
            echo "revision=$revision"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.image.outputs.tag }}
          tags: pve-csi:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Test Linux mount behavior in isolated containers
        run: |
          CGO_ENABLED=0 go test -tags=integration -c -o "$RUNNER_TEMP/linux.test" ./internal/linux
          docker run --rm --network=none --read-only --user 0:0 \
            --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp --tmpfs /var/lib/kubelet \
            --mount "type=bind,src=$RUNNER_TEMP/linux.test,dst=/tests/linux.test,readonly" \
            --entrypoint /tests/linux.test pve-csi:ci \
            -test.v -test.timeout=2m -test.run='^(TestNodeStartupWithMountPrivileges|TestAtomicBindSurvivesSIGKILL)$'
          docker run --rm --network=none --read-only --user 0:0 \
            --cap-drop=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /tmp --tmpfs /var/lib/kubelet \
            --mount "type=bind,src=$RUNNER_TEMP/linux.test,dst=/tests/linux.test,readonly" \
            --entrypoint /tests/linux.test pve-csi:ci \
            -test.v -test.timeout=2m -test.run='^TestNodeStartupWithoutMountPrivileges$'

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          tag="$IMAGE:$IMAGE_TAG"
          docker tag pve-csi:ci "$tag"
          docker push "$tag"
          {
            printf '### Published image\n\n'
            printf -- '- Commit: `%s`\n' "$REVISION"
            printf -- '- Tag: `%s`\n' "$tag"
            printf '\nImage published; no cluster deployment was performed.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    name: Publish Helm chart
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Package Helm chart
        id: chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm package charts/pve-csi --destination "$RUNNER_TEMP"
          {
            printf 'archive=%s/pve-csi-%s.tgz\n' "$RUNNER_TEMP" "$version"
            printf 'registry=%s\n' "$registry"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish Helm chart
        env:
          CHART_ARCHIVE: ${{ steps.chart.outputs.archive }}
          CHART_REGISTRY: ${{ steps.chart.outputs.registry }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "$CHART_ARCHIVE" "$CHART_REGISTRY"
          {
            printf '### Published Helm chart\n\n'
            printf -- '- Chart: `%s/pve-csi`\n' "$CHART_REGISTRY"
            printf -- '- Version: `%s`\n' "$CHART_VERSION"
            printf '\nChart published after its image; no cluster deployment was performed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
