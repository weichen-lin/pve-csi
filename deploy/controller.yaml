# Render with kubectl kustomize deploy; values come from config.env.
# Provisioning only; keep one controller replica.
apiVersion: v1
kind: Namespace
metadata:
  name: pve-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pve-csi-controller
  namespace: pve-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pve-csi-provisioner
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pve-csi-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pve-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: pve-csi-controller
    namespace: pve-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-csi-controller
  namespace: pve-csi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pve-csi-controller
  template:
    metadata:
      labels:
        app: pve-csi-controller
    spec:
      serviceAccountName: pve-csi-controller
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi
          image: pve-csi
          imagePullPolicy: Never
          args: [controller, --endpoint=unix:///csi/csi.sock]
          envFrom:
            - configMapRef:
                name: pve-csi-config
          env:
            - name: PVE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: pve-csi-pve
                  key: PVE_TOKEN_ID
            - name: PVE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: pve-csi-pve
                  key: PVE_TOKEN_SECRET
            - name: PVE_CA_FILE
              value: /etc/pve/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: [/bin/sh, -c, test -S /csi/csi.sock]
            periodSeconds: 5
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: pve-ca
              mountPath: /etc/pve
              readOnly: true
        - name: provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
          args:
            - --csi-address=/csi/csi.sock
            - --timeout=60s
            - --worker-threads=1
            - --snapshot-orphan-sweep-interval=0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        - name: socket
          emptyDir: {}
        - name: pve-ca
          configMap:
            name: pve-csi-ca
            items:
              - key: ca.crt
                path: ca.crt
