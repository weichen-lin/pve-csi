# Render with kubectl kustomize deploy; values come from config.env.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pve-csi-dev
provisioner: ""
parameters:
  storage: data-ssd
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
# Explicit PVE placement for provisioning acceptance without a Node service.
# This does not label the OrbStack node or make the disk mountable there.
allowedTopologies:
  - matchLabelExpressions:
      - key: /pve-node
        values: [""]
