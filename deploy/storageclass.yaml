# Render with kubectl kustomize deploy; values come from config.env.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pve-csi-dev
provisioner: ""
parameters:
  storage: data-ssd
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
# Single PVE host placement. Registration reports the same topology.
# A Bound PVC still cannot be mounted until attach/mount RPCs are implemented.
allowedTopologies:
  - matchLabelExpressions:
      - key: /pve-node
        values: [""]
