# OrbStack local query; use kubectl --context orbstack.
# PVE_VM_ID selects the remote VM to query, not the Pod node.
apiVersion: batch/v1
kind: Job
metadata:
  name: pve-csi-query-dev-005
  namespace: pve-csi-dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-csi-query
        app.kubernetes.io/version: dev-005
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: docker.io/library/pve-csi:dev-005
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          env:
            - name: PVE_ENDPOINT
              value: https://192.168.1.200:8006
            - name: PVE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: pve-api
                  key: TOKEN_ID
            - name: PVE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: pve-api
                  key: TOKEN_SECRET
            - name: PVE_CA_FILE
              value: /etc/pve-ca/pve-ca.pem
            - name: PVE_VM_ID
              value: "101"
            - name: PVE_STORAGE
              value: data-ssd
            - name: PVE_EXPECTED_VM_UUID
              value: 38f7a2bf-c484-47c9-90f6-250caaf28986
            - name: PVE_EXPECTED_VM_NAME
              value: k3s-worker-01
          volumeMounts:
            - name: pve-ca
              mountPath: /etc/pve-ca
              readOnly: true
      volumes:
        - name: pve-ca
          configMap:
            name: pve-ca
            defaultMode: 0444
            items:
              - key: pve-ca.pem
                path: pve-ca.pem
